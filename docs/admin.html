<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClevoLEDKeyboardControl · 用户改进计划</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      --bg: #0b0e15;
      --glow: #16233d;
      --panel: #131826;
      --panel-border: #232e45;
      --hairline: #1d2639;
      --text: #e9eef7;
      --muted: #93a0b6;
      --faint: #6d7a92;
      --accent: #3d7bfd;
      --accent-hover: #548aff;
      --spectrum: linear-gradient(90deg, #ff4e42, #ff9a3c, #ffd84a, #4ade80, #38c8f0, #6e8bff, #e05ce8);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(ellipse 70% 34rem at 8% -6%, var(--glow) 0, transparent 62%),
        radial-gradient(ellipse 50% 30rem at 96% 108%, #1a1730 0, transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }
    main { width: min(1080px, calc(100% - 36px)); margin: 0 auto; padding: 44px 0 60px; }
    h1 { margin: 0; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: .2px; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    p { margin: 0; }
    .subtle { color: var(--muted); font-size: 13px; }

    /* 品牌标记：三根光谱 LED 条 */
    .mark { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; padding: 4px; border-radius: 6px; background: #0d1220; border: 1px solid var(--panel-border); }
    .mark i { width: 3px; border-radius: 2px; }
    .mark i:nth-child(1) { height: 8px;  background: #ff4e42; }
    .mark i:nth-child(2) { height: 13px; background: #4ade80; }
    .mark i:nth-child(3) { height: 18px; background: #38c8f0; }
    .mark.lg { height: 34px; padding: 6px; border-radius: 9px; }
    .mark.lg i { width: 4px; }
    .mark.lg i:nth-child(1) { height: 12px; }
    .mark.lg i:nth-child(2) { height: 20px; }
    .mark.lg i:nth-child(3) { height: 27px; }

    .card, .panel {
      border: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(21, 27, 42, .92), rgba(17, 22, 35, .92));
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
    }
    .card { padding: 20px; }
    .panel { padding: 20px 22px; }

    button {
      border: 0; border-radius: 9px; padding: 9px 16px;
      font: inherit; font-size: 13.5px; font-weight: 600;
      color: #fff; background: var(--accent); cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    button.ghost { background: transparent; border: 1px solid var(--panel-border); color: var(--muted); }
    button.ghost:hover { color: var(--text); border-color: #33405f; background: rgba(255,255,255,.03); }
    :is(button, input):focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }

    input {
      width: 100%; border: 1px solid #2b3650; border-radius: 9px;
      padding: 11px 12px; color: var(--text); background: #0d1120;
      font: inherit; font-size: 13.5px; transition: border-color .15s ease;
    }
    input:hover { border-color: #35426a; }
    input:focus { border-color: var(--accent); outline: none; }

    /* ---- 登录卡 ---- */
    .config { max-width: 430px; margin: 9vh auto 0; padding: 30px 30px 26px; text-align: left; }
    .config::before {
      content: ""; display: block; height: 3px; width: 64px; border-radius: 2px;
      background: var(--spectrum); margin-bottom: 20px;
    }
    .config h1 { margin-top: 14px; }
    .config .lead { color: var(--muted); font-size: 13.5px; margin-top: 8px; line-height: 1.6; }
    .config-row { margin-top: 16px; }
    .config-row label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
    .config-row button { width: 100%; padding: 11px; margin-top: 6px; }
    .error { color: #ff8e8e; font-size: 13px; margin-top: 12px; min-height: 20px; }

    /* ---- 仪表盘 ---- */
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand h1 { font-size: clamp(21px, 2.6vw, 27px); }
    .brand-title {
      background: linear-gradient(90deg,
        #ff4e42, #ff9a3c, #ffd84a, #4ade80, #38c8f0, #6e8bff, #e05ce8,
        #ff4e42, #ff9a3c, #ffd84a, #4ade80, #38c8f0, #6e8bff, #e05ce8, #ff4e42);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brand-rainbow-flow 2.8s linear infinite;
      letter-spacing: .2px;
    }
    @keyframes brand-rainbow-flow { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
    @media (prefers-reduced-motion: reduce) { .brand-title { animation: none; background-position: 70% 50%; } }
    .brand .subtle { margin-top: 5px; }
    .actions { display: flex; gap: 10px; flex-shrink: 0; }

    .spectrum-line { height: 2px; border-radius: 1px; background: var(--spectrum); opacity: .8; margin-bottom: 22px; }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .metric { padding: 18px 20px 16px; position: relative; overflow: hidden; transition: border-color .15s ease; }
    .metric:hover { border-color: #32406a; }
    .metric-label { color: var(--muted); font-size: 13px; }
    .metric-value { margin-top: 10px; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .metric-value small { font-size: 13px; font-weight: 500; color: var(--faint); margin-left: 5px; }
    .metric::after {
      content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 2px;
      border-radius: 2px 2px 0 0; background: var(--spectrum);
      opacity: 0; transition: opacity .18s ease;
    }
    .metric:hover::after { opacity: .85; }

    .grid-panel { display: grid; grid-template-columns: 1fr 1.35fr; gap: 16px; margin-top: 16px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

    /* 版本分布：占比条行 */
    .version-row { display: grid; grid-template-columns: 64px 1fr 52px; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
    .version-row:last-child { border-bottom: 0; }
    .version-name { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
    .version-track { height: 8px; border-radius: 4px; background: #0d1120; overflow: hidden; }
    .version-track i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2c5fd8, #5ea0ff); }
    .version-count { font-size: 13.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    /* 每日活跃趋势 */
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 196px; padding-top: 6px; }
    .bar-col { flex: 1; min-width: 5px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; }
    .bar {
      width: 100%; min-height: 3px; border-radius: 4px 4px 2px 2px;
      background: linear-gradient(180deg, #5ea0ff, #2c5fd8);
      transform-origin: bottom; animation: rise .5s ease backwards;
    }
    .bar-col:hover .bar { background: linear-gradient(180deg, #8db8ff, #3d7bfd); }
    .bar-col.is-peak .bar { background: linear-gradient(180deg, #8db8ff, #3d7bfd); box-shadow: 0 0 10px rgba(94, 160, 255, .45); }
    .peak-val { font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .day { font-size: 10px; color: var(--faint); height: 13px; line-height: 13px; white-space: nowrap; }
    .bar-col:hover .day { color: var(--muted); }
    @keyframes rise { from { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }

    .empty { color: var(--faint); padding: 22px 0; font-size: 13.5px; }
    .hidden { display: none !important; }
    .footnote { margin-top: 18px; color: var(--faint); font-size: 12px; text-align: center; }

    @media (max-width: 760px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-panel { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <section id="config" class="card config">
      <div class="mark lg" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>用户改进计划</h1>
      <p class="lead">首次使用请确认函数地址并输入管理员口令，之后会记住在本机浏览器里。</p>
      <div class="config-row"><label>函数地址</label><input id="endpoint" value="https://1417250850-29682anb03.ap-guangzhou.tencentscf.com"></div>
      <div class="config-row"><label>管理员口令</label><input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN"></div>
      <div class="config-row"><button id="enterButton">进入后台</button></div>
      <div id="error" class="error" role="alert"></div>
    </section>

    <section id="dashboard" class="hidden">
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
          <div>
            <h1 class="brand-title">ClevoLEDKeyboardControl</h1>
            <p class="subtle">只显示设备汇总，不显示安装 ID 或其他个人信息。</p>
          </div>
        </div>
        <div class="actions">
          <button id="refreshButton">刷新数据</button>
          <button id="logoutButton" class="ghost">清除口令</button>
        </div>
      </header>
      <div class="spectrum-line" aria-hidden="true"></div>
      <div class="metrics">
        <div class="card metric"><div class="metric-label">总安装设备</div><div id="total" class="metric-value">—</div></div>
        <div class="card metric"><div class="metric-label">最近 1 天活跃</div><div id="active1d" class="metric-value">—</div></div>
        <div class="card metric"><div class="metric-label">最近 7 天活跃</div><div id="active7d" class="metric-value">—</div></div>
        <div class="card metric"><div class="metric-label">最近 30 天活跃</div><div id="active30d" class="metric-value">—</div></div>
      </div>
      <div class="grid-panel">
        <section class="panel">
          <div class="section-head"><h2>版本分布</h2><span class="subtle">按设备数</span></div>
          <div id="versions"></div>
        </section>
        <section class="panel">
          <div class="section-head"><h2>每日活跃趋势</h2><span id="updated" class="subtle"></span></div>
          <div id="chart"></div>
        </section>
      </div>
      <p class="footnote">数据由设备端汇总上报 · 仅在浏览器本地保存管理员口令</p>
    </section>
  </main>

  <script>
    var STORAGE_KEY = "clevo-usage-admin";
    var byId = function (id) { return document.getElementById(id); };
    var number = function (value) { return Number(value || 0).toLocaleString("zh-CN"); };

    function saved() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
    }
    function showError(message) { byId("error").textContent = message || ""; }

    async function loadSummary(endpoint, token) {
      var response = await fetch(endpoint.replace(/\/+$/, "") + "/admin/api/summary", {
        headers: { Authorization: "Bearer " + token },
        cache: "no-store"
      });
      if (response.status === 401) throw new Error("管理员口令不正确");
      if (!response.ok) throw new Error("后台暂时不可用（HTTP " + response.status + "）");
      return response.json();
    }

    function render(data) {
      var metric = function (id, value) {
        byId(id).innerHTML = number(value) + "<small>台</small>";
      };
      metric("total", data.totalInstallations);
      metric("active1d", data.active1d);
      metric("active7d", data.active7d);
      metric("active30d", data.active30d);
      byId("updated").textContent = "更新于 " + new Date(data.generatedAt).toLocaleString("zh-CN");

      var versions = data.versions || [];
      if (!versions.length) {
        byId("versions").innerHTML = "<div class='empty'>暂时没有数据</div>";
      } else {
        var maxCount = Math.max.apply(null, versions.map(function (item) { return Number(item.device_count || 0); }).concat([1]));
        var rows = versions.map(function (item) {
          var count = Number(item.device_count || 0);
          var width = Math.max(4, Math.round(count / maxCount * 100));
          return "<div class='version-row'><span class='version-name'>" + item.version + "</span>" +
            "<div class='version-track' title='" + item.version + "：" + number(count) + " 台'><i style='width:" + width + "%'></i></div>" +
            "<span class='version-count'>" + number(count) + " 台</span></div>";
        }).join("");
        byId("versions").innerHTML = rows;
      }

      var daily = data.daily || [];
      if (!daily.length) { byId("chart").innerHTML = "<div class='empty'>暂时没有每日活跃数据</div>"; return; }
      var values = daily.map(function (item) { return Number(item.active_devices || 0); });
      var max = Math.max.apply(null, values.concat([1]));
      var peakIndex = values.indexOf(Math.max.apply(null, values));
      var bars = daily.map(function (item, index) {
        var value = values[index];
        var height = Math.max(3, Math.round(value / max * 148));
        var showDay = index % 5 === 0 || index === daily.length - 1;
        var peak = index === peakIndex && value > 0 ? "<b class='peak-val'>" + number(value) + "</b>" : "";
        return "<div class='bar-col" + (index === peakIndex ? " is-peak" : "") + "' title='" + item.activity_date + "：" + number(value) + " 台'>" +
          peak + "<div class='bar' style='height:" + height + "px; animation-delay:" + (index * 12) + "ms'></div>" +
          "<span class='day'>" + (showDay ? item.activity_date.slice(5) : "") + "</span></div>";
      }).join("");
      byId("chart").innerHTML = "<div class='chart'>" + bars + "</div>";
    }

    function enter() {
      var endpoint = byId("endpoint").value.trim();
      var token = byId("token").value.trim();
      if (!endpoint || !token) { showError("请填写函数地址和管理员口令"); return; }
      var button = byId("enterButton");
      button.disabled = true;
      showError("加载中…");
      loadSummary(endpoint, token).then(function (data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ endpoint: endpoint, token: token }));
        showError("");
        button.disabled = false;
        byId("config").classList.add("hidden");
        byId("dashboard").classList.remove("hidden");
        render(data);
      }).catch(function (error) {
        button.disabled = false;
        showError(error.message + "（若始终失败，请确认函数 URL 设置里已启用 CORS）");
      });
    }

    byId("enterButton").addEventListener("click", enter);
    byId("token").addEventListener("keydown", function (event) { if (event.key === "Enter") enter(); });
    byId("refreshButton").addEventListener("click", function () {
      var state = saved();
      if (!state.endpoint) return;
      loadSummary(state.endpoint, state.token).then(render).catch(function (error) { alert(error.message); });
    });
    byId("logoutButton").addEventListener("click", function () {
      localStorage.removeItem(STORAGE_KEY);
      byId("dashboard").classList.add("hidden");
      byId("config").classList.remove("hidden");
    });

    (function init() {
      var state = saved();
      if (state.endpoint) {
        byId("endpoint").value = state.endpoint;
        byId("token").value = state.token || "";
        if (state.token) enter();
      }
    })();
  </script>
</body>
</html>
